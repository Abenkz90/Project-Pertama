<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSA-KU</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
  }
  body {
    background: #f5f5f5;
    padding: 0;
  }
  .header {
    background: #2563eb;
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 20px;
  }
  .container {
    padding: 20px;
    max-width: 500px;
    margin: auto;
  }
  .saldo-card {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    padding: 24px;
    border-radius: 20px;
    margin-bottom: 24px;
  }
  .saldo-label {
    font-size: 14px;
    opacity: 0.9;
    margin-bottom: 8px;
  }
  .saldo-amount {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    text-align: center;
  }
  .menu-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  .menu-icon {
    width: 50px;
    height: 50px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .section-title {
    font-weight: 600;
    margin: 20px 0 16px;
    color: #333;
  }
  .layanan-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    text-align: center;
  }
  .layanan-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #555;
  }
  .layanan-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .bg-orange { background: #fff3e0; color: #f57c00; }
  .bg-blue { background: #e3f2fd; color: #1e88e5; }
  .bg-yellow { background: #fffde7; color: #fbc02d; }
  .bg-purple { background: #f3e5f5; color: #8e24aa; }
  .bg-green { background: #e8f5e9; color: #43a047; }
  .bg-red { background: #ffebee; color: #e53935; }
  .bg-gray { background: #f5f5f5; color: #9e9e9e; }
</style>
</head>
<body>

  <div class="header">
    PULSA-KU
    <i class="fa-regular fa-bell"></i>
  </div>

  <div class="container">
    
    <div class="saldo-card">
      <div class="saldo-label">Total Saldo Agen</div>
      <div class="saldo-amount">Rp 2.540.000</div>
      <div class="menu-grid">
        <div class="menu-item">
          <div class="menu-icon"><i class="fa-solid fa-plus"></i></div>
          Top Up
        </div>
        <div class="menu-item">
          <div class="menu-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
          Riwayat
        </div>
        <div class="menu-item">
          <div class="menu-icon"><i class="fa-solid fa-gift"></i></div>
          Hadiah
        </div>
        <div class="menu-item">
          <div class="menu-icon"><i class="fa-solid fa-wallet"></i></div>
          Transfer
        </div>
      </div>
    </div>

    <div class="section-title">Layanan Utama</div>
    
    <div class="layanan-grid">
      <div class="layanan-item">
        <div class="layanan-icon bg-orange"><i class="fa-solid fa-mobile-screen"></i></div>
        Pulsa
      </div>
      <div class="layanan-item">
        <div class="layanan-icon bg-blue"><i class="fa-solid fa-globe"></i></div>
        Paket Data
      </div>
      <div class="layanan-item">
        <div class="layanan-icon bg-yellow"><i class="fa-solid fa-bolt"></i></div>
        Token PLN
      </div>
      <div class="layanan-item">
        <div class="layanan-icon bg-purple"><i class="fa-solid fa-tv"></i></div>
        TV Kabel
      </div>
      <div class="layanan-item">
        <div class="layanan-icon bg-green"><i class="fa-solid fa-droplet"></i></div>
        PDAM
      </div>
      <div class="layanan-item">
        <div class="layanan-icon bg-red"><i class="fa-solid fa-gamepad"></i></div>
        Voucher Game
      </div>
      <div class="layanan-item">
        <div class="layanan-icon bg-green"><i class="fa-solid fa-receipt"></i></div>
        BPJS
      </div>
      <div class="layanan-item">
        <div class="layanan-icon bg-gray"><i class="fa-solid fa-ellipsis"></i></div>
        Lainnya
      </div>
    </div>

  </div>

</body>
</html>
